databaseChangeLog:
  - changeSet:
      id: create-events-table
      author: hlieb
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description_small
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: description_full
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: avatar_image
                  type: varchar(255)
              - column:
                  name: main_image
                  type: varchar(255)
              - column:
                  name: video_link
                  type: varchar(255)
              - column:
                  name: maximum_participants
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: date_of_start_event
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: registration_available_until
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_events_users
                    references: users(id)
              - column:
                  name: is_deleted
                  type: tinyint(1)
                  constraints:
                    nullable: false
