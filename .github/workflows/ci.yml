name: Java CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Clear Maven Cache
        run: mvn clean

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify -X

      - name: Package application (without tests)
        if: always()
        run: mvn package -DskipTests
